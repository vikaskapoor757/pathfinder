name: Supabase keep-alive

# Supabase free-tier projects auto-pause after 7 days of inactivity.
# This workflow hits the project's REST endpoint every 3 days to keep
# the project active until Pathfinder's traffic alone is enough.
#
# The URL + anon key below are already public (shipped to every browser
# via NEXT_PUBLIC_* env vars), so hardcoding them here is safe. If the
# project is ever recreated with a new ref, update the SUPABASE_URL below.

on:
  schedule:
    # 06:00 UTC on days 1, 4, 7, 10, 13, 16, 19, 22, 25, 28 — well under
    # the 7-day pause window with a comfortable safety margin.
    - cron: "0 6 1,4,7,10,13,16,19,22,25,28 * *"
  workflow_dispatch: {} # also runnable manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://lekhynwaodnqlbhtxlkm.supabase.co
      SUPABASE_ANON_KEY: sb_publishable_0WjSJfsyi4YKcbbmXhrHOA_6UdmNA_g
    steps:
      - name: Hit Supabase REST + Auth to register activity
        run: |
          set -euo pipefail

          echo "Pinging auth health..."
          curl --fail --silent --show-error --max-time 20 \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/auth/v1/health" | head -c 500
          echo

          echo "Pinging REST (profiles count — anon has no rows via RLS, but the DB is woken)..."
          curl --fail --silent --show-error --max-time 20 \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Prefer: count=exact" \
            "${SUPABASE_URL}/rest/v1/profiles?select=id&limit=1" | head -c 500
          echo

          echo "Done."
